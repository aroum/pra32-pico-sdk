name: Build Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: pra32
            id: 1
          - board: nizkoteno
            id: 2
          - board: omsk
            id: 3
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: "."
          cmake_args: "-DCURRENT_BOARD=${{ matrix.id }} -DCMAKE_CXX_FLAGS='-std=c++17'"

      - name: Generate Memory Report
        run: |
          # Make the script executable
          chmod +x build_all.sh
          
          # Provide the SDK path to the script so it doesn't fail during CMake configuration
          # The action usually downloads the SDK to this specific path
          export PICO_SDK_PATH=${{ github.workspace }}/_deps/pico_sdk-src
          
          # Run the script with -s (size report) and -b (board name)
          # Note: This might trigger a re-build if the script's build folder 
          # differs from the Action's default 'build' folder.
          ./build_all.sh -b ${{ matrix.board }} -s
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build_${{ matrix.board }}/*.uf2
            build_${{ matrix.board }}/*.elf
