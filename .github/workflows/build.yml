name: Build Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: pra32
            id: 1
          - board: nizkoteno
            id: 2
          - board: omsk
            id: 3
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: "."
          cmake_args: "-DCURRENT_BOARD=${{ matrix.id }} -DCMAKE_CXX_FLAGS='-std=c++17'"

      - name: Generate Memory Report
        shell: bash
        run: |
          # 1. Locate the ELF file (Pico-Build-Action typically places it in the build folder)
          ELF_FILE=$(find build -name "*.elf" | head -n 1)
          
          if [ -z "$ELF_FILE" ]; then
            echo "Error: ELF file not found!"
            exit 1
          fi

          echo -e "\n\033[0;32m=== Detailed Memory Analysis for ${{ matrix.board }} ===\033[0m"

          # Fetch section data using arm-none-eabi-size
          MAP_DATA=$(arm-none-eabi-size -A "$ELF_FILE")
          
          # Helper function to extract size by section name
          get_size() {
              local val=$(echo "$MAP_DATA" | grep -E "^\.$1" | awk '{print $2}' | head -n 1)
              echo ${val:-0}
          }

          # Extract specific section values
          TEXT=$(get_size "text")
          RODATA=$(get_size "rodata")
          DATA=$(get_size "data")
          BSS=$(get_size "bss")
          STACK=$(get_size "stack_dummy")
          BINARY_INFO=$(get_size "binary_info")
          
          # Memory Calculations
          TOTAL_FLASH=$((TEXT + RODATA + DATA + BINARY_INFO))
          TOTAL_RAM=$((DATA + BSS + STACK))
          MAX_FLASH=$((16 * 1024 * 1024)) # Assuming 16MB Flash
          MAX_RAM=$((264 * 1024))        # Standard RP2040 RAM
          
          # Calculate Flash percentage (using awk for precision and compatibility)
          FLASH_PCT=$(awk "BEGIN {printf \"%.2f\", ($TOTAL_FLASH * 100 / $MAX_FLASH)}")

          echo -e "\033[0;33m1. Flash (Non-volatile Memory)\033[0m"
          printf "   .text:   %12'd bytes\n" $TEXT
          printf "   .rodata: %12'd bytes\n" $RODATA
          printf "   .data:   %12'd bytes\n" $DATA
          echo -e "   -------------------------------------------"
          echo -e "   Total Flash Usage: \033[0;32m$((TOTAL_FLASH / 1024)) KB\033[0m (~$FLASH_PCT% of 16MB)"

          echo -e "\n\033[0;33m2. RAM (Operating Memory)\033[0m"
          printf "   .data:   %12'd bytes\n" $DATA
          printf "   .bss:    %12'd bytes\n" $BSS
          printf "   .stack:  %12'd bytes\n" $STACK
          echo -e "   -------------------------------------------"
          echo -e "   Total RAM Usage:   \033[0;32m$((TOTAL_RAM / 1024)) KB\033[0m out of 264 KB"
          echo -e "   Remaining RAM:     $(((MAX_RAM - TOTAL_RAM) / 1024)) KB\n"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build_${{ matrix.board }}/*.uf2
            build_${{ matrix.board }}/*.elf
