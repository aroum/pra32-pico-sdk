name: Build Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: pra32
            id: 1
          - board: nizkoteno
            id: 2
          - board: omsk
            id: 3
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: samyarsadat/Pico-Build-Action@v1
        with:
          source_dir: "."
          cmake_args: "-DCURRENT_BOARD=${{ matrix.id }}"

      - name: Generate Memory Report
        run: |
          chmod +x build_all.sh
          # Build is already done by the action, but build_all.sh -s will find it 
          # if the build directory name matches.
          # The action uses 'build' by default. My script uses 'build_${BOARD_NAME}'.
          # I'll just run build_all.sh -s -b ${{ matrix.board }}
          ./build_all.sh -b ${{ matrix.board }} -s
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build_${{ matrix.board }}/*.uf2
            build_${{ matrix.board }}/*.elf
